name: Build  
  
on:  
  push:  
    branches: [ 1.20.1-test ]  
  pull_request:  
    branches: [ 1.20.1-test ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
      
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
          
      - name: Set up JDK 17  
        uses: actions/setup-java@v4  
        with:  
          java-version: '17'  
          distribution: 'temurin'  
            
      - name: Grant execute permission for gradlew  
        run: chmod +x gradlew  
          
      - name: Build with Gradle  
        run: ./gradlew build --no-daemon  
          
      - name: Upload Fabric artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: reterraforged-fabric-${{ github.sha }}  
          path: fabric/build/libs/*fabric*.jar  
            
      - name: Upload Forge artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: reterraforged-forge-${{ github.sha }}  
          path: forge/build/libs/*forge*.jar  
            
      - name: Upload sources  
        uses: actions/upload-artifact@v4  
        with:  
          name: reterraforged-sources-${{ github.sha }}  
          path: |  
            fabric/build/libs/*sources*.jar  
            forge/build/libs/*sources*.jar  
            common/build/libs/*sources*.jar